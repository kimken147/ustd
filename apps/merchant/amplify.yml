version: 1
applications:
  - appRoot: apps/merchant
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - cd ../.. && pnpm install --frozen-lockfile
            - cd ../.. && pnpm --filter @morgan-ustd/shared build
        build:
          commands:
            - pnpm exec refine build
      artifacts:
        baseDirectory: build
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
          - node_modules/**/*
