version: 1
applications:
  - appRoot: apps/merchant
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - CI=true pnpm install --frozen-lockfile
            - pnpm --filter @morgan-ustd/shared build
        build:
          commands:
            - pnpm --filter @morgan-ustd/merchant exec refine build
      artifacts:
        baseDirectory: apps/merchant/build
        files:
          - '**/*'
      buildPath: /
