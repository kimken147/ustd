version: 1
applications:
  - appRoot: apps/merchant
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 18
            - nvm use 18
            - npm install -g pnpm
            - cd ../.. && CI=true pnpm install --frozen-lockfile
        build:
          commands:
            - npx @refinedev/cli build
      artifacts:
        baseDirectory: build
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
          - node_modules/**/*
