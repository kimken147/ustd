version: 1
applications:
  - appRoot: apps/admin
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - cd ../.. && CI=true pnpm install --frozen-lockfile
            - cd ../.. && pnpm --filter @morgan-ustd/shared build
        build:
          commands:
            - pnpm exec refine build
      artifacts:
        baseDirectory: build
        files:
          - '**/*'
