name: GAMAPAY-USDT - Docker - API
on:
  push:
    branches: [gamapay-usdt]
    paths:
      - "api/**"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: GAMAPAY-USDT API to Beanstalk
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v3

      - name: Create necessary folder
        run: |
          mkdir -p storage/framework/{sessions,views,cache}
          chmod -R 755 storage/framework

      - name: Make scripts executable
        run: |
          chmod +x docker/*.sh

      - name: Zip application for deployment
        run: zip -r application.zip . -x@.zipignore

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Inject slug/short variables
        uses: rlespinasse/github-slug-action@v4

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: GAMAPAY-USDT
          environment_name: GAMAPAY-USDT-env
          version_label: gamapay-usdt-${{ env.GITHUB_SHA_SHORT }}
          region: ap-southeast-1
          deployment_package: ./api/application.zip
          wait_for_environment_recovery: 10
          wait_for_deployment: false
          use_existing_version_if_available: true
